openapi: 3.0.0
info:
  title: Receitas API
  description: API RESTful para gerenciamento de receitas culinárias
  version: 1.0.0
servers:
  - url: http://receitas-api.test
    description: Servidor Local (Laravel Herd)

paths:
  /receitas:
    get:
      summary: Lista todas as receitas
      responses:
        '200':
          description: Lista retornada com sucesso
    post:
      summary: Cadastra uma nova receita
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - titulo
                - ingredientes
                - modo_preparo
              properties:
                titulo:
                  type: string
                  example: Bolo de Cenoura
                ingredientes:
                  type: string
                  example: Cenoura, ovos, farinha
                modo_preparo:
                  type: string
                  example: Bata tudo e asse
                tempo_preparo_minutos:
                  type: integer
                  example: 40
                categoria:
                  type: string
                  example: Sobremesa
      responses:
        '201':
          description: Receita cadastrada com sucesso
        '400':
          description: Dados incompletos

  /receitas/{id}:
    get:
      summary: Busca uma receita pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Receita encontrada
        '404':
          description: Receita não encontrada

    put:
      summary: Atualiza uma receita existente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                titulo:
                  type: string
                ingredientes:
                  type: string
                modo_preparo:
                  type: string
                tempo_preparo_minutos:
                  type: integer
                categoria:
                  type: string
      responses:
        '200':
          description: Receita atualizada com sucesso
        '404':
          description: Receita não encontrada

    delete:
      summary: Deleta uma receita
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Receita deletada com sucesso
        '404':
          description: Receita não encontrada